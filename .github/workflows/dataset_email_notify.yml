name: Dataset Request Email Notification

on:
  issues:
    types: [opened]

jobs:
  notify-email:
    runs-on: ubuntu-latest

    steps:
      - name: Check if dataset request
        id: filter
        run: |
          echo "${{ toJson(github.event.issue.labels) }}" | grep "dataset-request" || exit 0

      - name: Send email notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USER }}
          password: ${{ secrets.EMAIL_PASS }}
          subject: "📥 New Dataset Request #${{ github.event.issue.number }}"
          to: fiicane121@gmail.com
          from: GitHub Dataset Bot
          body: |
            A new dataset access request has been submitted.

            📌 Title: ${{ github.event.issue.title }}
            👤 User: ${{ github.event.issue.user.login }}
            📧 Issue URL: ${{ github.event.issue.html_url }}
