name: Dataset Access Request to XOLDS (Academic Use Only)
description: Request access to the dataset for academic research purposes
title: "[Dataset Request]: "
labels: ["dataset-request"]

body:

  - type: input
    id: full_name
    attributes:
      label: Full Name
      description: Enter your full legal name
    validations:
      required: true

  - type: input
    id: email
    attributes:
      label: Institutional Email Address
      description: Must be a university or research institution email
    validations:
      required: true

  - type: input
    id: institution
    attributes:
      label: Institution
      description: University or research organization you are affiliated with
    validations:
      required: true

  - type: dropdown
    id: role
    attributes:
      label: Academic Role
      description: Select your current academic position
      options:
        - Faculty
        - Postdoctoral Researcher
        - PhD Student
        - Master's Student
        - Undergraduate Student
        - Research Staff
        - Other
    validations:
      required: true

  - type: input
    id: supervisor_name
    attributes:
      label: Supervisor Name (If Applicable)
      description: |
        If you are an undergraduate student, you MUST provide your supervisor's full name.
        Otherwise, enter "N/A".
    validations:
      required: true


  - type: textarea
    id: project_description
    attributes:
      label: Research Project Description
      description: Describe your research project (100–300 words)
    validations:
      required: true

  - type: textarea
    id: intended_use
    attributes:
      label: Intended Use of Dataset
      description: Explain how you will use the dataset in your research
    validations:
      required: true

  - type: input
    id: dataset_name
    attributes:
      label: Dataset Name
      description: Specify the dataset you are requesting access to
    validations:
      required: true

  - type: checkboxes
    id: terms
    attributes:
      label: Terms and Conditions
      options:
        - label: I will use the dataset only for academic and research purposes
          required: true
        - label: I will not redistribute, publish in a public repository, or share the dataset with others
          required: true
        - label: I will properly cite the dataset in any publication
          required: true
        - label: I understand that access may be revoked if terms are violated
          required: true
