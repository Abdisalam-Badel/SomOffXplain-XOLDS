name: Dataset Access Request (Academic Use Only)
description: Request access to the dataset for academic research purposes
title: "[Dataset Request]: "
labels: ["dataset-request"]

body:

  - type: input
    id: full_name
    attributes:
      label: Full Name
      description: Enter your full legal name
    validations:
      required: true

  - type: input
    id: email
    attributes:
      label: Institutional Email
      description: Must be a university or research institution email
    validations:
      required: true

  - type: input
    id: institution
    attributes:
      label: Institution
    validations:
      required: true

  - type: dropdown
    id: role
    attributes:
      label: Academic Role
      options:
        - Faculty
        - Postdoctoral Researcher
        - PhD Student
        - Master's Student
        - Undergraduate Student
        - Research Staff
        - Other
    validations:
      required: true

  - type: textarea
    id: project
    attributes:
      label: Research Project Description
      description: Briefly describe your research (100–300 words)
    validations:
      required: true

  - type: textarea
    id: usage
    attributes:
      label: Intended Use
      description: Explain how you will use the dataset
    validations:
      required: true

  - type: input
    id: dataset
    attributes:
      label: Dataset Name
    validations:
      required: true

  - type: checkboxes
    id: terms
    attributes:
      label: Terms and Conditions
      options:
        - label: I will use the dataset only for academic and research purposes
          required: true
        - label: I will not redistribute or share the dataset
          required: true
        - label: I will properly cite the dataset in any publication
          required: true
        - label: I understand access may be revoked if terms are violated
          required: true
